<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgInt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#0b1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffe3b3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffe3b3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="600" fill="url(#bgInt)"/>
  <rect width="900" height="600" fill="url(#glow)"/>

  <!-- floor with perspective lines converging to vanishing point -->
  <polygon points="0,600 900,600 620,340 280,340" fill="#22314a"/>
  <g stroke="#3a4d6b" stroke-width="2">
    <line x1="90" y1="600" x2="380" y2="340"/>
    <line x1="300" y1="600" x2="430" y2="340"/>
    <line x1="600" y1="600" x2="470" y2="340"/>
    <line x1="810" y1="600" x2="520" y2="340"/>
  </g>

  <!-- ceiling LED strips -->
  <g fill="#ffe3b3" opacity="0.85">
    <rect x="330" y="60" width="240" height="10" rx="5"/>
    <rect x="230" y="95" width="440" height="10" rx="5"/>
    <rect x="150" y="130" width="600" height="10" rx="5"/>
  </g>

  <!-- left racking (multi-tier) -->
  <g fill="#33455f" stroke="#4a6280" stroke-width="2">
    <rect x="40" y="200" width="70" height="360"/>
    <rect x="150" y="230" width="60" height="320"/>
  </g>
  <g fill="#ffb95f" opacity="0.85">
    <rect x="45" y="230" width="60" height="18"/>
    <rect x="45" y="290" width="60" height="18"/>
    <rect x="45" y="350" width="60" height="18"/>
    <rect x="45" y="410" width="60" height="18"/>
    <rect x="45" y="470" width="60" height="18"/>
    <rect x="155" y="260" width="50" height="16"/>
    <rect x="155" y="320" width="50" height="16"/>
    <rect x="155" y="380" width="50" height="16"/>
    <rect x="155" y="440" width="50" height="16"/>
  </g>

  <!-- right racking (multi-tier, mirrored) -->
  <g fill="#33455f" stroke="#4a6280" stroke-width="2">
    <rect x="790" y="200" width="70" height="360"/>
    <rect x="690" y="230" width="60" height="320"/>
  </g>
  <g fill="#ffb95f" opacity="0.85">
    <rect x="795" y="230" width="60" height="18"/>
    <rect x="795" y="290" width="60" height="18"/>
    <rect x="795" y="350" width="60" height="18"/>
    <rect x="795" y="410" width="60" height="18"/>
    <rect x="795" y="470" width="60" height="18"/>
    <rect x="695" y="260" width="50" height="16"/>
    <rect x="695" y="320" width="50" height="16"/>
    <rect x="695" y="380" width="50" height="16"/>
    <rect x="695" y="440" width="50" height="16"/>
  </g>

  <!-- center aisle pallets -->
  <g fill="#213145" stroke="#4a6280" stroke-width="2">
    <rect x="400" y="470" width="100" height="60" rx="3"/>
    <rect x="420" y="430" width="60" height="40" rx="3"/>
  </g>

  <!-- forklift silhouette -->
  <g fill="#ffb95f">
    <rect x="330" y="500" width="55" height="26" rx="3"/>
    <rect x="380" y="470" width="8" height="56"/>
    <circle cx="345" cy="532" r="10" fill="#0b1c30"/>
    <circle cx="372" cy="532" r="10" fill="#0b1c30"/>
  </g>
</svg>
